<header class="site-header">
  <div class="navigation-wrapper">
    <a class="site-name" href="{{ '/' | relative_url }}">Xing Hu <span>Economics</span></a>
    {% assign current_url = page.url | remove: 'index.html' %}
    <nav aria-label="Main navigation">
      <ul class="navigation-links">
        {% for link in site.links %}
        <li><a href="{{ link.url | relative_url }}"{% if current_url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
