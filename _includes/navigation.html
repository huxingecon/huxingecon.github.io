<header class="site-header">
  <div class="navigation-wrapper{% if page.url == '/' %} navigation-wrapper-home{% endif %}">
    <a class="site-name" href="{{ '/' | relative_url }}">Xing Hu <span>Economics</span></a>
    {% assign current_url = page.url | remove: 'index.html' %}
    <nav aria-label="Main navigation">
      <ul class="navigation-links">
        {% for link in site.links %}
        <li><a href="{{ link.url | relative_url }}"{% if current_url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false">
      <svg class="theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
      <svg class="theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5" /><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" /></svg>
    </button>
  </div>
</header>
